name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los tests de conexión de portales abren un Chromium real contra un sitio local.
      - run: pnpm --filter @job-finder/sources exec playwright install --with-deps --only-shell chromium
      - run: pnpm format:check
      - run: pnpm lint
      # Build antes de typecheck/test: las apps consumen los tipos compilados de packages/*.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker compose build

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Se revisa todo el historial con la CLI. La acción de gitleaks revisa solo el rango del
      # push y falla en el primer push de un repo, cuyo primer commit no tiene padre.
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.24.3
          detect --source /repo --redact --no-banner --verbose
