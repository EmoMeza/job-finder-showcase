# Este nginx corre detrás del reverse proxy HTTPS del servidor (ver ADR 0010).
# Se respeta el protocolo original que informa ese proxy; sin él (ej. local), se usa el propio.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Subida de CVs (PDF).
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Agrega la IP de quien llama a la cadena que trae el proxy externo; la API toma la IP real.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Las respuestas de IA (ej. generar el perfil) pueden tardar más que los 60 s por defecto.
    proxy_read_timeout 200s;
  }

  # SPA: cualquier ruta del frontend sirve index.html.
  # Las cabeceras de la API las pone helmet; HSTS lo pone el proxy que termina HTTPS.
  location / {
    try_files $uri /index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
